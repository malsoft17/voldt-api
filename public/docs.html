<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171216">

    <title>Voldt API Docs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui.css"
    >

    <link rel="stylesheet" href="/UI/style.css">
</head>

<body class="docs-page">
    <nav class="navbar">
        <a href="/" class="brand">
            <span class="brand-icon">V</span>
            Voldt API
        </a>

        <a href="/" class="home">Beranda</a>
    </nav>

    <header class="docs-header">
        <span class="docs-label">API Reference</span>

        <h1>Dokumentasi Voldt API</h1>

        <p>
            REST API gratis tanpa iklan dan pungutan biaya untuk membantu developer
            mengembangkan bot WhatsApp dan berbagai project lainnya.
        </p>
    </header>

    <div class="docs-info">
        <span class="info-item">
            Format <strong>JSON</strong>
        </span>

        <span class="info-item">
            Protocol <strong>HTTPS</strong>
        </span>

        <span class="info-item">
            Status <strong>Online</strong>
        </span>
    </div>

    <main id="swagger-ui">
        <div class="chibi-loader">
            <img
                src="https://c.tenor.com/1k7Iny2RHjwAAAAd/tenor.gif"
                alt="Loading"
            >
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui-bundle.js"></script>

    <script>
        SwaggerUIBundle({
            url: "/docs.json",
            dom_id: "#swagger-ui",
            deepLinking: true,
            displayRequestDuration: false,
            filter: true,
            tryItOutEnabled: true,
            docExpansion: "list",
            defaultModelsExpandDepth: -1
        })
    </script>
</body>
</html>
