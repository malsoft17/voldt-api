<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e85d8f">

    <title>Voldt API Documentation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #e85d8f;
            --primary-dark: #cf4779;
            --text: #ffffff;
            --text-soft: rgba(255, 255, 255, 0.82);
            --border: rgba(255, 255, 255, 0.22);
            --surface: rgba(35, 20, 28, 0.62);
            --surface-soft: rgba(49, 27, 37, 0.58);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: url("/gambar/bg2.jpg") center center / cover no-repeat fixed;
            font-family: "Inter", sans-serif;
            color: var(--text);
        }

        .navbar {
            height: 68px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 999;
            background: rgba(25, 14, 20, 0.55);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: 800;
        }

        .brand-icon {
            width: 35px;
            height: 35px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: white;
            font-weight: 800;
        }

        .home {
            padding: 9px 15px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 700;
            border: 1px solid var(--border);
            background: rgba(35, 20, 28, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: 0.2s ease;
        }

        .home:hover {
            color: white;
            background: rgba(232, 93, 143, 0.65);
        }

        .docs-header {
            max-width: 1160px;
            margin: auto;
            padding: 55px 28px 25px;
            text-shadow: 0 3px 18px rgba(0, 0, 0, 0.5);
        }

        .docs-badge {
            display: inline-block;
            padding: 7px 11px;
            border-radius: 999px;
            color: #ffb3cc;
            background: rgba(35, 20, 28, 0.60);
            border: 1px solid var(--border);
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-shadow: none;
        }

        .docs-header h1 {
            margin: 0 0 12px;
            color: white;
            font-size: clamp(34px, 6vw, 54px);
            letter-spacing: -2.5px;
        }

        .docs-header p {
            margin: 0;
            max-width: 620px;
            color: var(--text-soft);
            line-height: 1.7;
            font-size: 15px;
        }

        #swagger-ui {
            max-width: 1160px;
            margin: 0 auto;
            padding: 10px 20px 60px;
        }

        .swagger-ui {
            font-family: "Inter", sans-serif;
        }

        .swagger-ui .topbar {
            display: none;
        }

        .swagger-ui .information-container {
            display: none;
        }

        .swagger-ui .scheme-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            padding: 18px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .swagger-ui .scheme-container label,
        .swagger-ui .scheme-container select {
            color: white;
        }

        .swagger-ui .scheme-container select {
            background: rgba(20, 12, 16, 0.75);
        }

        .swagger-ui .opblock-tag {
            color: white;
            border-bottom: 1px solid var(--border);
            font-family: "Inter", sans-serif;
            font-size: 20px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }

        .swagger-ui .opblock-tag svg {
            fill: white;
        }

        .swagger-ui .opblock {
            border-radius: 14px;
            overflow: hidden;
            box-shadow: none;
            margin: 0 0 14px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .swagger-ui .opblock.opblock-get {
            background: rgba(49, 27, 37, 0.72);
            border-color: #efa3bf;
        }

        .swagger-ui .opblock.opblock-get .opblock-summary-method {
            background: var(--primary);
        }

        .swagger-ui .opblock.opblock-post {
            background: rgba(49, 27, 37, 0.72);
            border-color: #e78bad;
        }

        .swagger-ui .opblock.opblock-post .opblock-summary-method {
            background: #d95587;
        }

        .swagger-ui .opblock.opblock-put {
            background: rgba(49, 27, 37, 0.72);
            border-color: #dca0b7;
        }

        .swagger-ui .opblock.opblock-put .opblock-summary-method {
            background: #c87595;
        }

        .swagger-ui .opblock.opblock-delete {
            background: rgba(49, 27, 37, 0.72);
            border-color: #cf6f91;
        }

        .swagger-ui .opblock.opblock-delete .opblock-summary-method {
            background: #b94f75;
        }

        .swagger-ui .opblock .opblock-summary-method {
            border-radius: 8px;
            min-width: 76px;
            font-family: "Inter", sans-serif;
        }

        .swagger-ui .opblock .opblock-summary-path {
            color: white;
            font-family: monospace;
        }

        .swagger-ui .opblock .opblock-summary-path a {
            color: white;
        }

        .swagger-ui .opblock .opblock-summary-description {
            color: var(--text-soft);
        }

        .swagger-ui .opblock-description-wrapper p,
        .swagger-ui .opblock-external-docs-wrapper p,
        .swagger-ui .opblock-title_normal p,
        .swagger-ui .parameter__name,
        .swagger-ui .parameter__type,
        .swagger-ui .response-col_status,
        .swagger-ui .response-col_description,
        .swagger-ui table thead tr td,
        .swagger-ui table thead tr th,
        .swagger-ui .responses-inner h4,
        .swagger-ui .responses-inner h5 {
            color: white;
        }

        .swagger-ui .btn {
            border-radius: 9px;
            box-shadow: none;
            font-family: "Inter", sans-serif;
            color: white;
        }

        .swagger-ui .btn.execute {
            background: var(--primary);
            border-color: var(--primary);
        }

        .swagger-ui .btn.execute:hover {
            background: var(--primary-dark);
        }

        .swagger-ui input[type=text],
        .swagger-ui input[type=password],
        .swagger-ui input[type=search],
        .swagger-ui input[type=email],
        .swagger-ui textarea,
        .swagger-ui select {
            color: white;
            background: rgba(20, 12, 16, 0.78);
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
        }

        .swagger-ui input::placeholder,
        .swagger-ui textarea::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }

        .swagger-ui input:focus,
        .swagger-ui textarea:focus,
        .swagger-ui select:focus {
            border-color: var(--primary);
        }

        .swagger-ui .model-box {
            background: var(--surface-soft);
            border-radius: 10px;
        }

        .swagger-ui .model,
        .swagger-ui .model-title,
        .swagger-ui .prop-type,
        .swagger-ui .prop-format {
            color: white;
        }

        .swagger-ui section.models {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .swagger-ui section.models h4,
        .swagger-ui section.models h4 span {
            color: white;
        }

        .swagger-ui .highlight-code,
        .swagger-ui .microlight {
            background: rgba(20, 12, 16, 0.88) !important;
        }

        @media (max-width: 600px) {
            body {
                background-attachment: scroll;
            }

            .navbar {
                padding: 0 20px;
            }

            .docs-header {
                padding: 40px 20px 20px;
            }

            #swagger-ui {
                padding-left: 10px;
                padding-right: 10px;
            }

            .swagger-ui .opblock .opblock-summary {
                align-items: flex-start;
            }

            .swagger-ui .opblock .opblock-summary-description {
                display: none;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="/" class="brand">
            <span class="brand-icon">V</span>
            Voldt API
        </a>

        <a href="/" class="home">Home</a>
    </nav>

    <header class="docs-header">
        <span class="docs-badge">API Documentation</span>

        <h1>Rest Api Anti iklan dan pungutan biaya</h1>

        <p>
            Tujuan Api ini di buat adalah Buat bersenang senang dan membantu developer bot whatsapp dalam mengatasi masalah api
        </p>
    </header>

    <main id="swagger-ui"></main>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui-bundle.js"></script>

    <script>
        SwaggerUIBundle({
            url: "/docs.json",
            dom_id: "#swagger-ui",
            deepLinking: true,
            displayRequestDuration: true,
            filter: true,
            tryItOutEnabled: true
        })
    </script>
</body>
</html>
