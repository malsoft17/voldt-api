<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff8fb">

    <title>Voldt API Documentation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: #fff8fb;
            --surface: #ffffff;
            --surface-soft: #fff1f6;
            --primary: #e85d8f;
            --primary-dark: #cf4779;
            --primary-soft: #ffdce8;
            --text: #2b2025;
            --text-soft: #7c6870;
            --border: #f2dbe4;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            font-family: "Inter", sans-serif;
        }

        .navbar {
            height: 68px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 999;
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(14px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
            font-size: 18px;
            font-weight: 800;
        }

        .brand-icon {
            width: 35px;
            height: 35px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: white;
            font-weight: 800;
        }

        .home {
            padding: 9px 15px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 700;
            border: 1px solid var(--border);
            background: white;
            transition: 0.2s ease;
        }

        .home:hover {
            color: var(--primary);
            background: var(--surface-soft);
        }

        .docs-header {
            max-width: 1160px;
            margin: auto;
            padding: 55px 28px 25px;
        }

        .docs-badge {
            display: inline-block;
            padding: 7px 11px;
            border-radius: 999px;
            color: var(--primary-dark);
            background: var(--primary-soft);
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .docs-header h1 {
            margin: 0 0 12px;
            color: var(--text);
            font-size: clamp(34px, 6vw, 54px);
            letter-spacing: -2.5px;
        }

        .docs-header p {
            margin: 0;
            max-width: 620px;
            color: var(--text-soft);
            line-height: 1.7;
            font-size: 15px;
        }

        #swagger-ui {
            max-width: 1160px;
            margin: 0 auto;
            padding: 10px 20px 60px;
        }

        .swagger-ui {
            font-family: "Inter", sans-serif;
            color: var(--text);
        }

        .swagger-ui .topbar {
            display: none;
        }

        .swagger-ui .information-container {
            display: none;
        }

        .swagger-ui .scheme-container {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: none;
            padding: 18px;
        }

        .swagger-ui .opblock-tag {
            color: var(--text);
            border-bottom: 1px solid var(--border);
            font-family: "Inter", sans-serif;
            font-size: 20px;
        }

        .swagger-ui .opblock {
            border-radius: 14px;
            overflow: hidden;
            box-shadow: none;
            margin: 0 0 14px;
        }

        .swagger-ui .opblock.opblock-get {
            background: #fff5f8;
            border-color: #efa3bf;
        }

        .swagger-ui .opblock.opblock-get .opblock-summary-method {
            background: var(--primary);
        }

        .swagger-ui .opblock.opblock-post {
            background: #fff2f7;
            border-color: #e78bad;
        }

        .swagger-ui .opblock.opblock-post .opblock-summary-method {
            background: #d95587;
        }

        .swagger-ui .opblock.opblock-put {
            background: #fff7fa;
            border-color: #dca0b7;
        }

        .swagger-ui .opblock.opblock-put .opblock-summary-method {
            background: #c87595;
        }

        .swagger-ui .opblock.opblock-delete {
            background: #fff0f4;
            border-color: #cf6f91;
        }

        .swagger-ui .opblock.opblock-delete .opblock-summary-method {
            background: #b94f75;
        }

        .swagger-ui .opblock .opblock-summary-method {
            border-radius: 8px;
            min-width: 76px;
            font-family: "Inter", sans-serif;
        }

        .swagger-ui .opblock .opblock-summary-path {
            color: var(--text);
            font-family: monospace;
        }

        .swagger-ui .opblock .opblock-summary-description {
            color: var(--text-soft);
        }

        .swagger-ui .btn {
            border-radius: 9px;
            box-shadow: none;
            font-family: "Inter", sans-serif;
        }

        .swagger-ui .btn.execute {
            background: var(--primary);
            border-color: var(--primary);
        }

        .swagger-ui .btn.execute:hover {
            background: var(--primary-dark);
        }

        .swagger-ui input[type=text],
        .swagger-ui input[type=password],
        .swagger-ui input[type=search],
        .swagger-ui input[type=email],
        .swagger-ui textarea,
        .swagger-ui select {
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
        }

        .swagger-ui input:focus,
        .swagger-ui textarea:focus,
        .swagger-ui select:focus {
            border-color: var(--primary);
        }

        .swagger-ui .response-col_status {
            color: var(--primary-dark);
        }

        .swagger-ui .model-box {
            background: var(--surface-soft);
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 0 20px;
            }

            .docs-header {
                padding: 40px 20px 20px;
            }

            #swagger-ui {
                padding-left: 10px;
                padding-right: 10px;
            }

            .swagger-ui .opblock .opblock-summary {
                align-items: flex-start;
            }

            .swagger-ui .opblock .opblock-summary-description {
                display: none;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="/" class="brand">
            <span class="brand-icon">V</span>
            Voldt API
        </a>

        <a href="/" class="home">Home</a>
    </nav>

    <header class="docs-header">
        <span class="docs-badge">API Documentation</span>

        <h1>Explore Voldt API.</h1>

        <p>
            Browse available endpoints, inspect request parameters,
            view response schemas, and test API requests directly from the documentation.
        </p>
    </header>

    <main id="swagger-ui"></main>

    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist/swagger-ui-bundle.js"></script>

    <script>
        SwaggerUIBundle({
            url: "/docs.json",
            dom_id: "#swagger-ui",
            deepLinking: true,
            displayRequestDuration: true,
            filter: true,
            tryItOutEnabled: true
        })
    </script>
</body>
</html>
